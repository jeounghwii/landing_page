<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정휘의 실험실</title>
  <meta name="description" content="@web world for wiser life — 바이브 코딩으로 만든 결과물과 코드를 모아 둡니다." />
  <meta name="theme-color" content="#2A0612" />

  <!-- 링크 공유 미리보기(카카오톡·인스타 DM 등) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="정휘의 실험실" />
  <meta property="og:description" content="@web world for wiser life" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1629197520669-0210d6b270d9?w=1200&h=630&fit=crop&q=80" />

  <!-- 파비콘: 버건디 사각형 위에 '정' -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235E0F2C'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-size='36' font-family='sans-serif' font-weight='700' fill='%23F3DDE4'%3E%EC%A0%95%3C/text%3E%3C/svg%3E" />

  <!-- 글꼴: Gloock(영문 헤드라인) + Pretendard(한글·본문) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1) Title Bar -->
  <header class="titlebar" id="titlebar">
    <a class="titlebar__home" href="#top">정휘의 실험실</a>
    <nav aria-label="주요 메뉴">
      <a class="titlebar__link" href="#repos">저장소</a>
    </nav>
  </header>

  <main id="top">

    <!-- 2) Top Image + Slogan -->
    <section class="hero" aria-labelledby="slogan">
      <h1 class="hero__slogan" id="slogan" lang="en">
        <span class="hero__line">@web world</span>
        <span class="hero__line">for wiser life<span class="hero__caret" aria-hidden="true"></span></span>
      </h1>
    </section>

    <!-- 3) GitHub Repos -->
    <section class="repos" id="repos" aria-labelledby="repos-title">
      <div class="repos__inner">
        <h2 class="repos__title" id="repos-title">GitHub 저장소</h2>
        <p class="repos__intro">바이브 코딩으로 만든 결과물과 코드를 모아 둡니다.</p>

        <!-- 목록은 script.js의 REPOS 배열에서 그려집니다 -->
        <ul class="repo-list" id="repo-list"></ul>

        <noscript>
          <p class="repos__intro">
            <a class="repo-fallback" href="https://github.com/5c4scttz92-maker/tul-letter">tul-letter 저장소 열기</a>
          </p>
        </noscript>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>© <span id="year">2026</span> 정휘의 실험실</p>
    <p>
      배경 사진
      <a href="https://unsplash.com/photos/deep-burgundy-watercolor-texture-GP2sJoqnuXI" target="_blank" rel="noopener">Kseniya Lapteva / Unsplash</a>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
